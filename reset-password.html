<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Guardian AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script><script src="email-validation.js"></script>
  <style>*{box-sizing:border-box}body{margin:0;background:#f0f5fc;color:#1a3a5c;font:16px/1.6 Arial,sans-serif}main{max-width:520px;margin:10vh auto;padding:32px;background:white;border:1px solid #dce5ef;border-radius:20px}h1{font:600 36px Georgia,serif}a{color:#2e6db4}label{display:block;margin:20px 0 8px}input,button{font:inherit;padding:12px;border-radius:8px;width:100%}input{border:1px solid #bac9d9}button{margin:16px 0;background:#1a3a5c;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}#status{color:#52677e}[hidden]{display:none!important}@media(max-width:560px){main{margin:32px 16px;padding:24px}}</style>
</head>
<body><main><a href="index.html">Guardian AI</a><h1>Reset your password</h1><p id="status" role="status">Checking your recovery link…</p>
<form id="reset-form" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><p>Use uppercase, lowercase, a number, and a special character.</p><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128" required><button id="save" type="submit">Save new password</button></form><a href="login.html">Back to sign in</a></main><script src="reset-password.js"></script></body></html>
